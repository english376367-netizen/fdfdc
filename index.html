const state=TERMS.map(()=>({answered:false,correct:false,choice:-1}));let idx=0;
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
const choiceSets=TERMS.map((_,i)=>shuffle([i,...shuffle(TERMS.map((t,j)=>j).filter(j=>j!==i)).slice(0,2)]));
function render(){let t=TERMS[idx],s=state[idx];document.getElementById('count').textContent=`Question ${idx+1} of ${TERMS.length}`;document.getElementById('prompt').textContent=`Choose the picture for: ${t[0]}`;let root=document.getElementById('options');root.innerHTML='';choiceSets[idx].forEach((j,k)=>{let x=TERMS[j],b=document.createElement('button');b.className='option';b.disabled=s.answered;let src=window.posterCrops[String(x[3])];b.innerHTML=(src?`<img src="${src}" alt="Picture option ${'ABC'[k]}">`:`<div class="fallback">${x[4]}</div>`)+`<div class="letter">${'ABC'[k]}</div><div class="meaning">${x[5]}</div>`;b.onclick=()=>answer(j);if(s.answered&&j===s.choice)b.style.borderColor=s.correct?'#168343':'#c43e43';if(s.answered&&j===idx)b.style.borderColor='#168343';root.appendChild(b)});let f=document.getElementById('feedback');f.className='feedback';f.textContent='';if(s.answered){f.classList.add(s.correct?'good':'bad');f.textContent=s.correct?'Correct! Well done.':`Incorrect. The correct answer is ${t[0]}.`}document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===TERMS.length-1?'Finish':'Next →';let done=state.filter(x=>x.answered).length,score=state.filter(x=>x.answered&&x.correct).length;document.getElementById('score').textContent=`Score: ${score} / ${done}`;document.getElementById('bar').style.width=(done/TERMS.length*100)+'%';document.querySelectorAll('.num').forEach((b,j)=>{b.classList.toggle('current',j===idx);b.classList.toggle('done',state[j].answered);b.classList.toggle('correct',state[j].answered&&state[j].correct);b.classList.toggle('wrong',state[j].answered&&!state[j].correct)})}
function answer(j){if(state[idx].answered)return;state[idx]={answered:true,correct:j===idx,choice:j};render()}
function go(n){idx=Math.max(0,Math.min(TERMS.length-1,n));render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>{if(idx===TERMS.length-1){let score=state.filter(x=>x.answered&&x.correct).length;document.getElementById('prompt').textContent='Quiz complete!';document.getElementById('options').innerHTML='';let f=document.getElementById('feedback');f.className='feedback good';f.textContent=`Final score: ${score} / ${TERMS.length}`;document.getElementById('next').disabled=true}else go(idx+1)};
TERMS.forEach((t,i)=>{let b=document.createElement('button');b.className='num';b.textContent=i+1;b.onclick=()=>go(i);document.getElementById('numbers').appendChild(b)});render();
</script></body></html>
